<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bad Bubble</title>
    <style>
        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* Constant warm beige background for browser window */
            background: #f5f5dc;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ============================================
           GAME CONTAINER - Portrait frame
           ============================================ */
        #game-container {
            position: relative;
            width: min(90vw, 400px);
            height: min(85vh, 700px);
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* ============================================
           SCORE DISPLAY
           ============================================ */
        #score-display {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            z-index: 10;
            letter-spacing: 0.5px;
        }

        /* ============================================
           PLAY AREA - Where bubbles float
           ============================================ */
        #play-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* ============================================
           BUBBLE STYLES - Soapy finish
           ============================================ */
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            /* Soapy iridescent look with multiple highlight layers */
            background: 
                radial-gradient(
                    ellipse 40% 40% at 25% 20%,
                    rgba(255, 255, 255, 0.95) 0%,
                    rgba(255, 255, 255, 0.4) 30%,
                    transparent 70%
                ),
                radial-gradient(
                    ellipse 30% 20% at 70% 75%,
                    rgba(255, 255, 255, 0.5) 0%,
                    transparent 60%
                ),
                radial-gradient(
                    ellipse 100% 100% at 50% 50%,
                    rgba(255, 255, 255, 0.08) 0%,
                    rgba(255, 255, 255, 0.15) 40%,
                    rgba(255, 255, 255, 0.05) 60%,
                    rgba(255, 255, 255, 0.2) 100%
                );
            /* Soapy border and glow */
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.15),
                0 0 40px rgba(255, 255, 255, 0.08),
                inset 0 0 20px rgba(255, 255, 255, 0.1),
                inset -2px -2px 10px rgba(255, 255, 255, 0.15);
            will-change: transform, left, top;
            transition: transform 0.1s ease-out;
        }

        .bubble:hover {
            transform: scale(1.05);
        }

        .bubble:active {
            transform: scale(0.95);
        }

        /* Pop animation */
        .bubble.popping {
            animation: popBubble 0.25s ease-out forwards;
            pointer-events: none;
        }

        @keyframes popBubble {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.6; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Chain reaction pop - more visible */
        .bubble.chain-pop {
            animation: chainPop 0.15s ease-out forwards;
            pointer-events: none;
        }

        @keyframes chainPop {
            0% { transform: scale(1); opacity: 1; }
            30% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* ============================================
           GAME OVER SCREEN
           ============================================ */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #game-over-screen.visible {
            display: flex;
            opacity: 1;
        }

        #game-over-screen h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: 1px;
        }

        #game-over-screen .scores {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.8;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-button {
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .game-button.primary {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .game-button.secondary {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .game-button:hover {
            transform: scale(1.03);
        }

        .game-button:active {
            transform: scale(0.97);
        }

        /* ============================================
           START SCREEN
           ============================================ */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        #start-screen h1 {
            font-size: 2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        #start-screen .tagline {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <!-- Main game container (portrait frame) -->
    <div id="game-container">
        <!-- Score display (visible during gameplay) -->
        <div id="score-display" style="display: none;">0</div>

        <!-- Play area where bubbles float -->
        <div id="play-area"></div>

        <!-- Start screen -->
        <div id="start-screen">
            <h1>Bad Bubble</h1>
            <p class="tagline">Find the bad one</p>
            <button class="game-button primary" id="start-button">Play</button>
        </div>

        <!-- Game over screen -->
        <div id="game-over-screen">
            <h2>Bad Bubble Located</h2>
            <div class="scores">
                <div>Score: <span id="final-score">0</span></div>
                <div>Best: <span id="best-score">0</span></div>
            </div>
            <div class="button-group">
                <button class="game-button primary" id="play-again-button">Play Again</button>
                <button class="game-button secondary" id="home-button">Home</button>
            </div>
        </div>
    </div>

    <script>
        /* ============================================
           GAME CONFIGURATION
           ============================================ */
        const CONFIG = {
            BUBBLE_COUNT: 16,
            BUBBLE_SIZE_MIN: 38,
            BUBBLE_SIZE_MAX: 54,
            RESPAWN_DELAY: 1500,
            BAD_BUBBLE_DELAY: 200,
            FLOAT_SPEED: 0.25,
            WOBBLE_AMOUNT: 0.6,
            WOBBLE_SPEED: 0.015,
            COLLISION_PADDING: 8,       // Extra space between bubbles
            PUSH_STRENGTH: 0.5          // How strongly bubbles push apart
        };

        /* ============================================
           DARK GRADIENT BACKGROUNDS
           ============================================ */
        const GRADIENTS = [
            'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',  // Deep blue
            'linear-gradient(135deg, #2d132c 0%, #4a1942 50%, #801336 100%)',  // Deep magenta
            'linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%)',  // Navy
            'linear-gradient(135deg, #1a1423 0%, #2d1f3d 50%, #4a3158 100%)',  // Deep purple
            'linear-gradient(135deg, #0b3d2e 0%, #145a44 50%, #1d7a5c 100%)',  // Forest green
            'linear-gradient(135deg, #1c1c1c 0%, #2d2d44 50%, #3d3d5c 100%)',  // Charcoal purple
            'linear-gradient(135deg, #2c1810 0%, #4a2c1a 50%, #6b4423 100%)',  // Deep bronze
            'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)',  // Deep teal
            'linear-gradient(135deg, #1f1013 0%, #3d1f25 50%, #5c2e38 100%)',  // Deep rose
            'linear-gradient(135deg, #1a1a0f 0%, #2d2d1a 50%, #4a4a2a 100%)'   // Deep olive
        ];

        /* ============================================
           AUDIO GENERATION (Web Audio API)
           ============================================ */
        const AudioManager = {
            context: null,

            init() {
                if (!this.context) {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.context.state === 'suspended') {
                    this.context.resume();
                }
            },

            playPop() {
                if (!this.context) return;
                
                const ctx = this.context;
                const now = ctx.currentTime;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.1);

                const bufferSize = ctx.sampleRate * 0.05;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                }

                const noise = ctx.createBufferSource();
                const noiseGain = ctx.createGain();
                noise.buffer = buffer;
                noiseGain.gain.setValueAtTime(0.08, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                noise.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start(now);
            },

            playFart() {
                if (!this.context) return;

                const ctx = this.context;
                const now = ctx.currentTime;

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();

                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(80, now);
                osc1.frequency.exponentialRampToValueAtTime(40, now + 0.3);

                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.linearRampToValueAtTime(0.1, now + 0.1);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                const mod = ctx.createOscillator();
                const modGain = ctx.createGain();
                mod.frequency.setValueAtTime(25, now);
                modGain.gain.setValueAtTime(30, now);
                mod.connect(modGain);
                modGain.connect(osc1.frequency);

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, now);
                filter.frequency.linearRampToValueAtTime(150, now + 0.3);

                osc1.connect(filter);
                filter.connect(gain1);
                gain1.connect(ctx.destination);

                mod.start(now);
                osc1.start(now);
                mod.stop(now + 0.35);
                osc1.stop(now + 0.35);

                const noiseLength = ctx.sampleRate * 0.3;
                const noiseBuffer = ctx.createBuffer(1, noiseLength, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseLength; i++) {
                    noiseData[i] = (Math.random() * 2 - 1) * Math.sin(i / noiseLength * Math.PI);
                }

                const noise = ctx.createBufferSource();
                const noiseGain = ctx.createGain();
                const noiseFilter = ctx.createBiquadFilter();

                noise.buffer = noiseBuffer;
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(200, now);
                noiseGain.gain.setValueAtTime(0.15, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start(now);
            }
        };

        /* ============================================
           GAME STATE
           ============================================ */
        const GameState = {
            MENU: 'menu',
            PLAYING: 'playing',
            CHAIN_REACTION: 'chainReaction',
            GAME_OVER: 'gameOver'
        };

        /* ============================================
           MAIN GAME OBJECT
           ============================================ */
        const Game = {
            state: GameState.MENU,
            score: 0,
            bestScore: 0,
            bubbles: [],
            badBubbleId: null,
            animationId: null,
            playArea: null,
            playAreaRect: null,
            gameContainer: null,
            respawnTimeouts: [],

            init() {
                this.playArea = document.getElementById('play-area');
                this.gameContainer = document.getElementById('game-container');
                this.scoreDisplay = document.getElementById('score-display');
                this.startScreen = document.getElementById('start-screen');
                this.gameOverScreen = document.getElementById('game-over-screen');
                this.finalScoreEl = document.getElementById('final-score');
                this.bestScoreEl = document.getElementById('best-score');

                this.bestScore = parseInt(localStorage.getItem('badBubbleBest')) || 0;

                this.setRandomBackground();

                // Use bound functions to properly handle event listeners
                document.getElementById('start-button').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.startGame();
                });
                document.getElementById('play-again-button').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.startGame();
                });
                document.getElementById('home-button').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.goHome();
                });

                window.addEventListener('resize', () => this.updatePlayAreaRect());
            },

            setRandomBackground() {
                const gradient = GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)];
                this.gameContainer.style.background = gradient;
            },

            updatePlayAreaRect() {
                this.playAreaRect = this.playArea.getBoundingClientRect();
            },

            // Clean up everything before starting new game
            cleanup() {
                // Cancel animation frame
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }

                // Clear all respawn timeouts
                this.respawnTimeouts.forEach(timeout => clearTimeout(timeout));
                this.respawnTimeouts = [];

                // Clear bubbles array
                this.bubbles = [];

                // Clear play area DOM
                this.playArea.innerHTML = '';
            },

            startGame() {
                // Full cleanup first
                this.cleanup();

                // Initialize audio
                AudioManager.init();

                // Reset state
                this.state = GameState.PLAYING;
                this.score = 0;
                this.badBubbleId = null;

                // Update UI
                this.scoreDisplay.textContent = '0';
                this.scoreDisplay.style.display = 'block';
                this.startScreen.style.display = 'none';
                this.gameOverScreen.classList.remove('visible');
                this.gameOverScreen.style.display = 'none';

                // Set new random background
                this.setRandomBackground();

                // Get play area dimensions
                this.updatePlayAreaRect();

                // Create initial bubbles with collision-free placement
                this.createInitialBubbles();

                // Randomly assign one bubble as "bad"
                this.assignBadBubble();

                // Start animation loop
                this.startAnimationLoop();
            },

            // Create all bubbles with non-overlapping positions
            createInitialBubbles() {
                for (let i = 0; i < CONFIG.BUBBLE_COUNT; i++) {
                    this.createBubble(false, true);
                }
            },

            // Find a position that doesn't overlap with existing bubbles
            findNonOverlappingPosition(size) {
                const maxX = this.playAreaRect.width - size;
                const maxY = this.playAreaRect.height - size;
                const maxAttempts = 50;

                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    const x = Math.random() * maxX;
                    const y = Math.random() * maxY;
                    const radius = size / 2;
                    const centerX = x + radius;
                    const centerY = y + radius;

                    let overlapping = false;
                    for (const other of this.bubbles) {
                        const otherRadius = other.size / 2;
                        const otherCenterX = other.x + otherRadius;
                        const otherCenterY = other.y + otherRadius;

                        const dx = centerX - otherCenterX;
                        const dy = centerY - otherCenterY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const minDistance = radius + otherRadius + CONFIG.COLLISION_PADDING;

                        if (distance < minDistance) {
                            overlapping = true;
                            break;
                        }
                    }

                    if (!overlapping) {
                        return { x, y };
                    }
                }

                // Fallback: return random position if no non-overlapping found
                return { x: Math.random() * maxX, y: Math.random() * maxY };
            },

            createBubble(delayed = false, initialPlacement = false) {
                if (this.state !== GameState.PLAYING) return null;

                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                const id = 'bubble_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                bubble.dataset.id = id;

                const size = CONFIG.BUBBLE_SIZE_MIN + 
                    Math.random() * (CONFIG.BUBBLE_SIZE_MAX - CONFIG.BUBBLE_SIZE_MIN);
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';

                // Find non-overlapping position
                const position = this.findNonOverlappingPosition(size);
                const x = position.x;
                const y = position.y;

                bubble.style.left = x + 'px';
                bubble.style.top = y + 'px';

                // Create bubble data object
                const bubbleData = {
                    id,
                    element: bubble,
                    x,
                    y,
                    size,
                    wobbleOffset: Math.random() * Math.PI * 2,
                    vx: 0,  // Velocity for collision response
                    vy: 0
                };

                // Click/tap handler
                const handleClick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.handleBubbleClick(id);
                };

                bubble.addEventListener('click', handleClick);
                bubble.addEventListener('touchend', handleClick, { passive: false });

                // Add to DOM
                if (delayed) {
                    bubble.style.opacity = '0';
                    bubble.style.transform = 'scale(0.5)';
                    this.playArea.appendChild(bubble);
                    
                    requestAnimationFrame(() => {
                        bubble.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        bubble.style.opacity = '1';
                        bubble.style.transform = 'scale(1)';
                        // Remove transition after animation to not interfere with movement
                        setTimeout(() => {
                            bubble.style.transition = 'transform 0.1s ease-out';
                        }, 300);
                    });
                } else {
                    this.playArea.appendChild(bubble);
                }

                this.bubbles.push(bubbleData);
                return id;
            },

            assignBadBubble() {
                if (this.bubbles.length > 0) {
                    const randomIndex = Math.floor(Math.random() * this.bubbles.length);
                    this.badBubbleId = this.bubbles[randomIndex].id;
                }
            },

            handleBubbleClick(bubbleId) {
                if (this.state !== GameState.PLAYING) return;

                const bubbleIndex = this.bubbles.findIndex(b => b.id === bubbleId);
                if (bubbleIndex === -1) return;

                const bubble = this.bubbles[bubbleIndex];

                if (bubbleId === this.badBubbleId) {
                    this.handleBadBubble(bubble);
                } else {
                    this.handleNormalBubble(bubble, bubbleIndex);
                }
            },

            handleNormalBubble(bubble, index) {
                AudioManager.playPop();

                this.score++;
                this.scoreDisplay.textContent = this.score;

                bubble.element.classList.add('popping');

                // Remove from tracking immediately
                this.bubbles.splice(index, 1);

                // Remove element after animation
                setTimeout(() => {
                    if (bubble.element.parentNode) {
                        bubble.element.remove();
                    }
                }, 250);

                // Respawn after delay
                const timeout = setTimeout(() => {
                    if (this.state === GameState.PLAYING) {
                        const newId = this.createBubble(true);
                        
                        // If bad bubble was removed somehow, reassign
                        if (newId && !this.bubbles.find(b => b.id === this.badBubbleId)) {
                            this.badBubbleId = newId;
                        }
                    }
                }, CONFIG.RESPAWN_DELAY);

                this.respawnTimeouts.push(timeout);
            },

            handleBadBubble(bubble) {
                // Change state to prevent further clicks
                this.state = GameState.CHAIN_REACTION;

                // Small delay, then fart sound and chain reaction
                setTimeout(() => {
                    AudioManager.playFart();

                    // Pop the bad bubble first
                    bubble.element.classList.add('popping');

                    // Remove bad bubble from array
                    const badIndex = this.bubbles.findIndex(b => b.id === bubble.id);
                    if (badIndex !== -1) {
                        this.bubbles.splice(badIndex, 1);
                    }

                    // Chain reaction with staggered timing for visibility
                    const remainingBubbles = [...this.bubbles];
                    remainingBubbles.forEach((b, i) => {
                        setTimeout(() => {
                            b.element.classList.add('chain-pop');
                        }, 10 + (i * 6)); // Stagger each pop by 50ms
                    });

                    // Clear the bubbles array
                    this.bubbles = [];

                    // Calculate total chain reaction time
                    const chainDuration = 80 + (remainingBubbles.length * 50) + 400;

                    // Show game over after chain reaction completes
                    setTimeout(() => {
                        this.showGameOver();
                    }, chainDuration);

                }, CONFIG.BAD_BUBBLE_DELAY);
            },

            showGameOver() {
                this.state = GameState.GAME_OVER;

                // Stop animation
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }

                // Clear respawn timeouts
                this.respawnTimeouts.forEach(timeout => clearTimeout(timeout));
                this.respawnTimeouts = [];

                // Update best score
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('badBubbleBest', this.bestScore);
                }

                // Update UI
                this.finalScoreEl.textContent = this.score;
                this.bestScoreEl.textContent = this.bestScore;
                this.scoreDisplay.style.display = 'none';

                // Show game over screen
                this.gameOverScreen.style.display = 'flex';
                requestAnimationFrame(() => {
                    this.gameOverScreen.classList.add('visible');
                });
            },

            goHome() {
                this.cleanup();
                this.state = GameState.MENU;

                // Update UI
                this.gameOverScreen.classList.remove('visible');
                this.gameOverScreen.style.display = 'none';
                this.startScreen.style.display = 'flex';

                this.setRandomBackground();
            },

            // Handle collision between two bubbles
            handleCollision(b1, b2) {
                const r1 = b1.size / 2;
                const r2 = b2.size / 2;
                const c1x = b1.x + r1;
                const c1y = b1.y + r1;
                const c2x = b2.x + r2;
                const c2y = b2.y + r2;

                const dx = c2x - c1x;
                const dy = c2y - c1y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDistance = r1 + r2 + CONFIG.COLLISION_PADDING;

                if (distance < minDistance && distance > 0) {
                    // Normalize direction
                    const nx = dx / distance;
                    const ny = dy / distance;

                    // Calculate overlap
                    const overlap = minDistance - distance;

                    // Push bubbles apart
                    const push = overlap * CONFIG.PUSH_STRENGTH;
                    b1.x -= nx * push * 0.5;
                    b1.y -= ny * push * 0.5;
                    b2.x += nx * push * 0.5;
                    b2.y += ny * push * 0.5;
                }
            },

            startAnimationLoop() {
                let lastTime = performance.now();

                const animate = (currentTime) => {
                    if (this.state !== GameState.PLAYING) return;

                    const deltaTime = Math.min((currentTime - lastTime) / 16, 3); // Cap delta
                    lastTime = currentTime;

                    const maxX = this.playAreaRect.width;
                    const maxY = this.playAreaRect.height;

                    // Update each bubble
                    this.bubbles.forEach(bubble => {
                        bubble.wobbleOffset += CONFIG.WOBBLE_SPEED * deltaTime;

                        // Float upward with wobble
                        bubble.y -= CONFIG.FLOAT_SPEED * deltaTime;
                        bubble.x += Math.sin(bubble.wobbleOffset) * CONFIG.WOBBLE_AMOUNT * deltaTime;

                        // Wrap around vertically
                        if (bubble.y < -bubble.size) {
                            bubble.y = maxY;
                            bubble.x = Math.random() * (maxX - bubble.size);
                        }

                        // Keep X within bounds
                        if (bubble.x < 0) bubble.x = 0;
                        if (bubble.x > maxX - bubble.size) bubble.x = maxX - bubble.size;
                    });

                    // Handle collisions
                    for (let i = 0; i < this.bubbles.length; i++) {
                        for (let j = i + 1; j < this.bubbles.length; j++) {
                            this.handleCollision(this.bubbles[i], this.bubbles[j]);
                        }
                    }

                    // Ensure bubbles stay in bounds after collision
                    this.bubbles.forEach(bubble => {
                        if (bubble.x < 0) bubble.x = 0;
                        if (bubble.x > maxX - bubble.size) bubble.x = maxX - bubble.size;
                        if (bubble.y > maxY) bubble.y = maxY;

                        // Update DOM
                        bubble.element.style.left = bubble.x + 'px';
                        bubble.element.style.top = bubble.y + 'px';
                    });

                    this.animationId = requestAnimationFrame(animate);
                };

                this.animationId = requestAnimationFrame(animate);
            }
        };

        // Initialize game when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            Game.init();
        });
    </script>
