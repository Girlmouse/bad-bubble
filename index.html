<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bad Bubble</title>
    <style>
        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background 0.5s ease;
            background: #ece6dd; /* warm cream beige */
        }

        /* ============================================
           GAME CONTAINER - Portrait frame
           ============================================ */
        #game-container {
            position: relative;
            width: min(90vw, 400px);
            height: min(85vh, 700px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2px);
        }

        /* ============================================
           SCORE DISPLAY
           ============================================ */
        #score-display {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            z-index: 10;
            letter-spacing: 0.5px;
        }

        /* ============================================
           PLAY AREA - Where bubbles float
           ============================================ */
        #play-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* ============================================
           BUBBLE STYLES
           ============================================ */
       /* ---------- Bubble visuals & performance ---------- */
.bubble {
   position: absolute;
  width: var(--bubble-size, 72px);
  height: var(--bubble-size, 72px);
  border-radius: 50%;
  pointer-events: auto;
  cursor: pointer;
  ...
}

/* Invisible larger tap area */
.bubble::before {
  content: "";
  position: absolute;
  inset: -14px;   /* expands clickable area */
}

  /* airy glossy look with slightly stronger whites for contrast */
  background: radial-gradient(circle at 30% 30%,
              rgba(255,255,255,0.95) 0%,
              rgba(255,255,255,0.38) 45%,
              rgba(255,255,255,0.18) 100%);

  /* slight outer outline so bubbles read on darker gradients */
  outline: 1px solid rgba(255,255,255,0.10);

  /* soft glow */
  box-shadow:
    0 6px 18px rgba(0,0,0,0.06),
    inset 0 8px 18px rgba(255,255,255,0.05);

  /* use transform for compositing (much smoother) */
  will-change: transform, opacity;
  transition: transform 140ms cubic-bezier(.2,.9,.2,1), opacity 180ms linear;
  touch-action: none; /* we handle pointer events */
  user-select: none;
}

/* popped bubble animation (scales down quickly and fades) */
.bubble.popping {
  transform: scale(0.4) !important;
  opacity: 0;
}

/* container shadow so the playable area reads as "window" */
#game-container {
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  border: 2px solid rgba(255,255,255,0.18);
}

/* small top-right score */
#score {
  position: absolute;
  top: 10px;
  right: 14px;
  color: rgba(255,255,255,0.92);
  font-weight: 600;
  z-index: 40;
  font-size: 14px;
}

/* ensure game-over overlay sits above chain pops */
#game-over-overlay {
  z-index: 50;
}

/* tiny responsiveness: reduce bubble size on narrow screens */
@media (max-width: 420px) {
  :root { --bubble-size: 60px; }
}

        /* ============================================
           GAME OVER SCREEN
           ============================================ */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #game-over-screen.visible {
            display: flex;
            opacity: 1;
        }

        #game-over-screen h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: 1px;
        }

        #game-over-screen .scores {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.8;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-button {
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .game-button.primary {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .game-button.secondary {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .game-button:hover {
            transform: scale(1.03);
        }

        .game-button:active {
            transform: scale(0.97);
        }

        /* ============================================
           START SCREEN
           ============================================ */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #start-screen h1 {
            font-size: 2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        #start-screen .tagline {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <!-- Main game container (portrait frame) -->
    <div id="game-container">
        <!-- Score display (visible during gameplay) -->
        <div id="score-display" style="display: none;">0</div>

        <!-- Play area where bubbles float -->
        <div id="play-area"></div>

        <!-- Start screen -->
        <div id="start-screen">
            <h1>Bad Bubble</h1>
            <p class="tagline">Find the bad one</p>
            <button class="game-button primary" id="start-button">Play</button>
        </div>

        <!-- Game over screen -->
        <div id="game-over-screen">
            <h2>Bad Bubble Located</h2>
            <div class="scores">
                <div>Score: <span id="final-score">0</span></div>
                <div>Best: <span id="best-score">0</span></div>
            </div>
            <div class="button-group">
                <button class="game-button primary" id="play-again-button">Play Again</button>
                <button class="game-button secondary" id="home-button">Home</button>
            </div>
        </div>
    </div>

    <script>
     // ---------- Configuration ----------
const BUBBLE_COUNT = 24;
const RESPAWN_DELAY = 1500; // ms
const POP_DURATION = 180; // how long pop animation lasts (ms)
const BAD_PAUSE_MS = 200;  // micro pause before fart sound
const CHAIN_STAGGER = 20;  // ms between chained silent pops
const GRAVITY_DRIFT = -20; // upward pixels per second baseline (negative goes up)

// sound assets (update paths if your repo differs)
const POP_SOUND = './assets/pop.mp3';
const FART_SOUND = './assets/fart.mp3';

// ---------- Utility ----------
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rand(min, max) { return min + Math.random() * (max - min); }
function now() { return performance.now(); }

// ---------- Bubble Class ----------
class Bubble {
  constructor(id, container, size) {
    this.id = id;
    this.container = container;
    this.size = size;
    this.element = document.createElement('div');
    this.element.className = 'bubble';
    this.element.dataset.id = id;
    // initial random phase for wobble
    this.phase = Math.random() * Math.PI * 2;
    this.reset(true);
    container.appendChild(this.element);
  }

  reset(initial = false) {
    // position inside container bounds
    const rect = this.container.getBoundingClientRect();
    const pad = 12;
    this.x = rand(pad, rect.width - this.size - pad);
    // start distributed vertically (initial round start higher density)
    this.y = initial ? rand(10, rect.height * 0.5) : rand(rect.height * 0.6, rect.height - this.size - 8);
    this.vx = rand(-6, 6); // horizontal drift px/sec
    // upward baseline plus some randomness
    this.vy = rand(-20, -40); // px/sec (negative -> move up)
    this.wobbleAmp = rand(6, 16);
    this.wobbleSpeed = rand(0.8, 1.6);
    this.alive = true;
    // render immediately
    this.render();
    this.element.classList.remove('popping');
    this.element.style.opacity = '1';
  }

  render() {
    // use translate3d for best performance
    this.element.style.transform = `translate3d(${Math.round(this.x)}px, ${Math.round(this.y)}px, 0)`;
  }

  update(dt, width, height) {
    // dt in seconds
    // vertical + horizontal movement
    this.phase += this.wobbleSpeed * dt * 2 * Math.PI;
    const wobble = Math.sin(this.phase) * this.wobbleAmp;
    // Add a constant upward drift (gravity inverted)
    this.y += (this.vy + (GRAVITY_DRIFT * 0.02)) * dt * 60; // tuned multiplier for feel
    this.x += this.vx * dt * 60;

    // add subtle horizontal wobble
    this.renderX = this.x + wobble;

    // wrap-around vertical: if bubble floats off top, reappear bottom (lava-lamp illusion)
    if (this.y + this.size < -50) {
      this.y = height + 10;
    }
    // wrap horizontally too
    if (this.renderX > width + 40) this.x = -40;
    if (this.renderX < -80) this.x = width + 20;

    // commit render
    this.element.style.transform = `translate3d(${Math.round(this.renderX)}px, ${Math.round(this.y)}px, 0)`;
  }

  pop(silent = false) {
    if (!this.alive) return;
    this.alive = false;
    // visual pop
    this.element.classList.add('popping');
    // remove after animation completes
    setTimeout(() => {
      // hide element then respawn later
      this.element.style.opacity = '0';
      this.element.classList.remove('popping');
    }, POP_DURATION);
    // return promise-ish via timeout for chaining logic
    return new Promise(resolve => setTimeout(resolve, POP_DURATION));
  }

  removeDom() {
    if (this.element && this.element.parentNode) {
      this.element.parentNode.removeChild(this.element);
    }
  }
}

// ---------- Game Manager ----------
class BadBubbleGame {
  constructor() {
    this.container = document.getElementById('play-area');
    this.frame = document.getElementById('game-container');  // add this line

this.scoreEl = document.getElementById('score-display');
this.overlay = document.getElementById('game-over-screen');

this.playBtn = document.getElementById('start-button');
this.playAgainBtn = document.getElementById('play-again-button');
this.homeBtn = document.getElementById('home-button');;

    this.sounds = {
      pop: new Audio(POP_SOUND),
      fart: new Audio(FART_SOUND)
    };
    // reduce volume if needed
    this.sounds.pop.volume = 0.7;
    this.sounds.fart.volume = 0.85;

    this.bubbles = [];
    this.state = 'idle'; // idle | playing | gameover
    this.score = 0;
    this.best = parseInt(localStorage.getItem('badbubble_best') || '0', 10);

    this.lastTime = null;
    this.rafId = null;

    // event binding
    this.onPointerDown = this.onPointerDown.bind(this);
    this.play = this.play.bind(this);
    this.playAgain = this.playAgain.bind(this);

    this.attachUI();
    this.resizeAndInit();
    window.addEventListener('resize', () => this.resizeAndInit());
  }

  attachUI() {
    if (this.playBtn) this.playBtn.addEventListener('click', this.play);
    if (this.playAgainBtn) this.playAgainBtn.addEventListener('click', this.playAgain);
    if (this.homeBtn) this.homeBtn.addEventListener('click', () => location.reload());
    // pointerdown delegation on container
    this.container.addEventListener('pointerdown', this.onPointerDown);
  }

  resizeAndInit() {
    // clear any previous bubbles
    this.bubbles.forEach(b => b.removeDom());
    this.bubbles = [];

    // prepare container sizes
    const rect = this.container.getBoundingClientRect();
    this.width = rect.width;
    this.height = rect.height;
    // make sure CSS variable for bubble size exists (optional)
    const computedSize = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bubble-size') || '72', 10);
    this.bubbleSize = computedSize || 72;

    // populate bubbles
    for (let i = 0; i < BUBBLE_COUNT; i++) {
      const b = new Bubble(i, this.container, this.bubbleSize);
      this.bubbles.push(b);
    }
    // start idle visuals
    this.applyRandomBackground(); // keep this function in your code to set container gradient
    this.updateScoreUI();
    this.showOverlay(false);
  }

  updateScoreUI() {
    if (this.scoreEl) this.scoreEl.textContent = this.score;
  }

  play() {

    document.getElementById('start-screen').style.display = 'none';
    this.scoreEl.style.display = 'block';
      
    // reset state
    this.state = 'playing';
    this.score = 0;
    this.updateScoreUI();
    this.showOverlay(false);

    // pick a bad bubble at start and keep it constant
    this.badId = Math.floor(Math.random() * this.bubbles.length);

    // ensure all bubbles are alive
    this.bubbles.forEach(b => b.reset(true));
    // start animation loop
    this.lastTime = performance.now();
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = requestAnimationFrame(this.loop.bind(this));
  }

  playAgain() {
    this.play();
  }

  loop(timestamp) {
    const dt = this.lastTime ? (timestamp - this.lastTime) / 1000 : 0.016;
    this.lastTime = timestamp;

    // update bubbles
    for (const b of this.bubbles) {
     if (b.alive) b.update(dt * 0.35, this.width, this.height);
    }

    if (this.state === 'playing') {
      this.rafId = requestAnimationFrame(this.loop.bind(this));
    }
  }

  async onPointerDown(e) {
    // ensure only handle active game
    if (this.state !== 'playing') return;
    // find bubble element ancestor
    let el = e.target;
    // if click on nested element, climb until .bubble or container
    while (el && el !== this.container && !el.classList.contains('bubble')) {
      el = el.parentElement;
    }
    if (!el || el === this.container) return;

    e.preventDefault();

    const id = parseInt(el.dataset.id, 10);
    const bubble = this.bubbles.find(b => b.id === id);
    if (!bubble || !bubble.alive) return;

    // popped the bad bubble?
    if (id === this.badId) {
      // micro pause for anticipation
      setTimeout(() => this.handleBadBubble(bubble), BAD_PAUSE_MS);
      return;
    }

    // normal bubble
    // play pop sound
    try { this.sounds.pop.currentTime = 0; this.sounds.pop.play(); } catch(_) {}
    this.score += 1;
    this.updateScoreUI();
    // visual pop then respawn after delay
    bubble.pop(true).then(() => {
      setTimeout(() => {
        bubble.reset(false);
      }, RESPAWN_DELAY);
    });
  }

  async handleBadBubble(bubble) {
    if (this.state !== 'playing') return;
    // play fart sound
    try { this.sounds.fart.currentTime = 0; this.sounds.fart.play(); } catch(_) {}

    // mark game state so further taps are ignored
    this.state = 'ending';

    // chain pop all remaining alive bubbles (including the one that was popped)
    // pop the bad bubble first (visual)
    const aliveBubbles = this.bubbles.filter(b => b.alive);
    const badIndex = aliveBubbles.findIndex(b => b.id === bubble.id);
    // ensure bad bubble is popped visually first
    if (badIndex !== -1) {
      await aliveBubbles[badIndex].pop(true);
    }

    // pop the rest in a short stagger so it's clearly visible
    let idx = 0;
    for (const b of aliveBubbles) {
      if (b.id === bubble.id) continue;
      setTimeout(() => {
        b.pop(true);
      }, idx * CHAIN_STAGGER);
      idx++;
    }

    // compute total wait time until the last pop finishes
    const chainDuration = (idx * CHAIN_STAGGER) + POP_DURATION + 120;
    setTimeout(() => {
      this.finishRound();
    }, chainDuration);
  }

  finishRound() {
    // update best
    if (this.score > this.best) {
      this.best = this.score;
      localStorage.setItem('badbubble_best', String(this.best));
    }
    // show game-over overlay
    this.state = 'gameover';
    this.showOverlay(true);
    // cancel render loop
    if (this.rafId) cancelAnimationFrame(this.rafId);
  }

showOverlay(show) {
  if (!this.overlay) return;

  const scoreNode = document.getElementById('final-score');
  const bestNode = document.getElementById('best-score');

  if (show) {
    if (scoreNode) scoreNode.textContent = String(this.score);
    if (bestNode) bestNode.textContent = String(this.best);
    this.overlay.classList.add('visible');
  } else {
    this.overlay.classList.remove('visible');
  }
}

  // small helper: set a random gradient on container (you already had something like this)
  applyRandomBackground() {
    if (typeof setRandomBackground === 'function') {
      // if you have external setRandomBackground, keep it — call it
      setRandomBackground();
      return;
    }
    // fallback gradient:
    const gradients = [
      'linear-gradient(135deg, #6b4b5a 0%, #2e3a59 100%)',
      'linear-gradient(135deg, #3b6a73 0%, #1d2b3a 100%)',
      'linear-gradient(135deg, #6a6b3f 0%, #2d3a2a 100%)',
      'linear-gradient(135deg, #6b4a3f 0%, #2b2220 100%)',
      'linear-gradient(135deg, #4f4a7a 0%, #1f2140 100%)'
    ];
    const pick = gradients[Math.floor(Math.random() * gradients.length)];
    this.frame.style.background = pick;
  }
}

// ---------- Boot the game ----------
window.addEventListener('DOMContentLoaded', () => {
  // make sure your HTML uses these exact ids:
  // - "game-container" or "play-area" for the playable div,
  // - "score" for the top-right score,
  // - "game-over-overlay" for the overlay section,
  // - "play-btn", "play-again", "home-btn" for controls,
  // - "final-score" and "best-score" inside overlay
  window.BadBubble = new BadBubbleGame();
});
    </script>
</body>
