<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bad Bubble</title>
    <style>
        /* ============================================
           RESET & BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background 0.5s ease;
            background: #ece6dd; /* warm cream beige */
        }

        /* ============================================
           GAME CONTAINER - Portrait frame
           ============================================ */
        #game-container {
            position: relative;
            width: min(90vw, 400px);
            height: min(85vh, 700px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(2px);
        }

        /* ============================================
           SCORE DISPLAY
           ============================================ */
        #score-display {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            z-index: 10;
            letter-spacing: 0.5px;
        }

        /* ============================================
           PLAY AREA - Where bubbles float
           ============================================ */
        #play-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* ============================================
           BUBBLE STYLES
           ============================================ */
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            /* Semi-transparent white with subtle gradient for highlight */
            background: radial-gradient(
                ellipse 30% 30% at 30% 25%,
                rgba(255, 255, 255, 0.9),
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0.15)
            );
            /* Subtle glow effect */
            box-shadow: 
                0 0 15px rgba(255, 255, 255, 0.3),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
            /* Smooth transitions for movement */
            transition: transform 0.1s ease-out;
            will-change: transform, left, top;
        }

        .bubble:hover {
            transform: scale(1.05);
        }

        .bubble:active {
            transform: scale(0.95);
        }

        /* Pop animation */
        .bubble.popping {
            animation: popBubble 0.2s ease-out forwards;
            pointer-events: none;
        }

        @keyframes popBubble {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Silent pop for chain reaction */
        .bubble.silent-pop {
            animation: silentPop 0.3s ease-out forwards;
            pointer-events: none;
        }

        @keyframes silentPop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.5); opacity: 0; }
        }

        /* ============================================
           GAME OVER SCREEN
           ============================================ */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #game-over-screen.visible {
            display: flex;
            opacity: 1;
        }

        #game-over-screen h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: 1px;
        }

        #game-over-screen .scores {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.8;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-button {
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .game-button.primary {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .game-button.secondary {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .game-button:hover {
            transform: scale(1.03);
        }

        .game-button:active {
            transform: scale(0.97);
        }

        /* ============================================
           START SCREEN
           ============================================ */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #start-screen h1 {
            font-size: 2rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        #start-screen .tagline {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <!-- Main game container (portrait frame) -->
    <div id="game-container">
        <!-- Score display (visible during gameplay) -->
        <div id="score-display" style="display: none;">0</div>

        <!-- Play area where bubbles float -->
        <div id="play-area"></div>

        <!-- Start screen -->
        <div id="start-screen">
            <h1>Bad Bubble</h1>
            <p class="tagline">Find the bad one</p>
            <button class="game-button primary" id="start-button">Play</button>
        </div>

        <!-- Game over screen -->
        <div id="game-over-screen">
            <h2>Bad Bubble Located</h2>
            <div class="scores">
                <div>Score: <span id="final-score">0</span></div>
                <div>Best: <span id="best-score">0</span></div>
            </div>
            <div class="button-group">
                <button class="game-button primary" id="play-again-button">Play Again</button>
                <button class="game-button secondary" id="home-button">Home</button>
            </div>
        </div>
    </div>

    <script>
        /* ============================================
           GAME CONFIGURATION
           ============================================ */
        const CONFIG = {
            BUBBLE_COUNT: 24,
            BUBBLE_SIZE_MIN: 36,
            BUBBLE_SIZE_MAX: 52,
            RESPAWN_DELAY: 1500,      // ms before new bubble appears
            BAD_BUBBLE_DELAY: 200,    // ms delay before fart sound
            FLOAT_SPEED: 0.3,         // Upward drift speed
            WOBBLE_AMOUNT: 0.8,       // Horizontal wobble intensity
            WOBBLE_SPEED: 0.02        // Wobble frequency
        };

     // Moody indie dusk tones (better contrast for light bubbles)
       const GRADIENTS = [
 
  'linear-gradient(135deg, #6b4b5a 0%, #2e3a59 100%)', // mauve → slate
  'linear-gradient(135deg, #3b6a73 0%, #1d2b3a 100%)', // teal → navy
  'linear-gradient(135deg, #6a6b3f 0%, #2d3a2a 100%)', // olive → forest
  'linear-gradient(135deg, #6b4a3f 0%, #2b2220 100%)', // clay → charcoal
  'linear-gradient(135deg, #4f4a7a 0%, #1f2140 100%)', // lavender → midnight
  'linear-gradient(135deg, #3e5a7a 0%, #152235 100%)', // steel → deep blue
  'linear-gradient(135deg, #5f3d5a 0%, #261b2e 100%)', // plum dusk
  'linear-gradient(135deg, #3f6b5a 0%, #1c2f2a 100%)'  // sea green → deep teal
];

        /* ============================================
           AUDIO GENERATION (Web Audio API)
           ============================================ */
        const AudioManager = {
            context: null,

            // Initialize audio context (must be called after user interaction)
            init() {
                if (!this.context) {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                }
                // Resume if suspended (mobile browsers)
                if (this.context.state === 'suspended') {
                    this.context.resume();
                }
            },

            // Light champagne pop sound
            playPop() {
                if (!this.context) return;
                
                const ctx = this.context;
                const now = ctx.currentTime;

                // Create oscillator for the pop
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);

                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.1);

                // Add a subtle noise burst for fizz
                const bufferSize = ctx.sampleRate * 0.05;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
                }

                const noise = ctx.createBufferSource();
                const noiseGain = ctx.createGain();
                noise.buffer = buffer;
                noiseGain.gain.setValueAtTime(0.08, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);

                noise.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start(now);
            },

            // Funny airy cartoon fart sound
            playFart() {
                if (!this.context) return;

                const ctx = this.context;
                const now = ctx.currentTime;

                // Low rumbling oscillator
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();

                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(80, now);
                osc1.frequency.exponentialRampToValueAtTime(40, now + 0.3);

                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.linearRampToValueAtTime(0.1, now + 0.1);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                // Modulator for wobble effect
                const mod = ctx.createOscillator();
                const modGain = ctx.createGain();
                mod.frequency.setValueAtTime(25, now);
                modGain.gain.setValueAtTime(30, now);
                mod.connect(modGain);
                modGain.connect(osc1.frequency);

                // Filter for muffled effect
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, now);
                filter.frequency.linearRampToValueAtTime(150, now + 0.3);

                osc1.connect(filter);
                filter.connect(gain1);
                gain1.connect(ctx.destination);

                mod.start(now);
                osc1.start(now);
                mod.stop(now + 0.35);
                osc1.stop(now + 0.35);

                // Add airy noise component
                const noiseLength = ctx.sampleRate * 0.3;
                const noiseBuffer = ctx.createBuffer(1, noiseLength, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseLength; i++) {
                    noiseData[i] = (Math.random() * 2 - 1) * Math.sin(i / noiseLength * Math.PI);
                }

                const noise = ctx.createBufferSource();
                const noiseGain = ctx.createGain();
                const noiseFilter = ctx.createBiquadFilter();

                noise.buffer = noiseBuffer;
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(200, now);
                noiseGain.gain.setValueAtTime(0.15, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(ctx.destination);
                noise.start(now);
            }
        };

        /* ============================================
           GAME STATE
           ============================================ */
        const GameState = {
            MENU: 'menu',
            PLAYING: 'playing',
            GAME_OVER: 'gameOver'
        };

        /* ============================================
           MAIN GAME OBJECT
           ============================================ */
        const Game = {
            state: GameState.MENU,
            score: 0,
            bestScore: 0,
            bubbles: [],
            badBubbleId: null,
            animationId: null,
            playArea: null,
            playAreaRect: null,

            // Initialize the game
            init() {
                // Get DOM elements
                this.playArea = document.getElementById('play-area');
                this.scoreDisplay = document.getElementById('score-display');
                this.startScreen = document.getElementById('start-screen');
                this.gameOverScreen = document.getElementById('game-over-screen');
                this.finalScoreEl = document.getElementById('final-score');
                this.bestScoreEl = document.getElementById('best-score');

                // Load best score from localStorage
                this.bestScore = parseInt(localStorage.getItem('badBubbleBest')) || 0;

                // Set random background
                this.setRandomBackground();

                // Bind event listeners
                document.getElementById('start-button').addEventListener('click', () => this.startGame());
                document.getElementById('play-again-button').addEventListener('click', () => this.startGame());
                document.getElementById('home-button').addEventListener('click', () => this.goHome());

                // Handle window resize
                window.addEventListener('resize', () => this.updatePlayAreaRect());
            },

            // Set a random pastel gradient background
            setRandomBackground() {
               const gradient = GRADIENTS[Math.floor(Math.random() * GRADIENTS.length)];
  const container = document.getElementById('game-container');
  container.style.background = gradient;
},

            // Update play area dimensions
            updatePlayAreaRect() {
                this.playAreaRect = this.playArea.getBoundingClientRect();
            },

            // Start a new game
            startGame() {
                // Initialize audio on user interaction
                AudioManager.init();

                // Reset state
                this.state = GameState.PLAYING;
                this.score = 0;
                this.bubbles = [];
                this.badBubbleId = null;

                // Update UI
                this.scoreDisplay.textContent = '0';
                this.scoreDisplay.style.display = 'block';
                this.startScreen.style.display = 'none';
                this.gameOverScreen.classList.remove('visible');

                // Clear play area
                this.playArea.innerHTML = '';

                // Set new random background
                this.setRandomBackground();

                // Get play area dimensions
                this.updatePlayAreaRect();

                // Create initial bubbles
                for (let i = 0; i < CONFIG.BUBBLE_COUNT; i++) {
                    this.createBubble();
                }

                // Randomly assign one bubble as "bad"
                this.assignBadBubble();

                // Start animation loop
                this.startAnimationLoop();
            },

            // Create a single bubble
            createBubble(delayed = false) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                // Generate unique ID
                const id = Date.now() + Math.random();
                bubble.dataset.id = id;

                // Random size
                const size = CONFIG.BUBBLE_SIZE_MIN + 
                    Math.random() * (CONFIG.BUBBLE_SIZE_MAX - CONFIG.BUBBLE_SIZE_MIN);
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';

                // Random position within play area
                const maxX = this.playAreaRect.width - size;
                const maxY = this.playAreaRect.height - size;
                const x = Math.random() * maxX;
                const y = Math.random() * maxY;

                bubble.style.left = x + 'px';
                bubble.style.top = y + 'px';

                // Animation properties
                bubble.dataset.x = x;
                bubble.dataset.y = y;
                bubble.dataset.wobbleOffset = Math.random() * Math.PI * 2;
                bubble.dataset.size = size;

                // Click handler
                bubble.addEventListener('click', (e) => this.handleBubbleClick(e, id));
                bubble.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.handleBubbleClick(e, id);
                }, { passive: false });

                // Add to DOM (with optional delay for respawns)
                if (delayed) {
                    bubble.style.opacity = '0';
                    bubble.style.transform = 'scale(0.5)';
                    this.playArea.appendChild(bubble);
                    
                    // Animate in
                    requestAnimationFrame(() => {
                        bubble.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        bubble.style.opacity = '1';
                        bubble.style.transform = 'scale(1)';
                    });
                } else {
                    this.playArea.appendChild(bubble);
                }

                // Add to tracking array
                this.bubbles.push({
                    id,
                    element: bubble,
                    x,
                    y,
                    size,
                    wobbleOffset: parseFloat(bubble.dataset.wobbleOffset)
                });

                return id;
            },

            // Assign one random bubble as "bad"
            assignBadBubble() {
                const randomIndex = Math.floor(Math.random() * this.bubbles.length);
                this.badBubbleId = this.bubbles[randomIndex].id;
            },

            // Handle bubble click/tap
            handleBubbleClick(event, bubbleId) {
                if (this.state !== GameState.PLAYING) return;

                const bubbleIndex = this.bubbles.findIndex(b => b.id === bubbleId);
                if (bubbleIndex === -1) return;

                const bubble = this.bubbles[bubbleIndex];

                if (bubbleId === this.badBubbleId) {
                    // Bad bubble tapped!
                    this.handleBadBubble(bubble);
                } else {
                    // Normal bubble - pop it!
                    this.handleNormalBubble(bubble, bubbleIndex);
                }
            },

            // Handle normal bubble pop
            handleNormalBubble(bubble, index) {
                // Play pop sound
                AudioManager.playPop();

                // Increase score
                this.score++;
                this.scoreDisplay.textContent = this.score;

                // Pop animation
                bubble.element.classList.add('popping');

                // Remove from tracking
                this.bubbles.splice(index, 1);

                // Remove element after animation
                setTimeout(() => {
                    if (bubble.element.parentNode) {
                        bubble.element.remove();
                    }
                }, 200);

                // Respawn after delay
                setTimeout(() => {
                    if (this.state === GameState.PLAYING) {
                        const newId = this.createBubble(true);
                        
                        // Small chance the new bubble becomes the bad one
                        // (only if bad bubble still exists)
                        if (this.badBubbleId === null || 
                            !this.bubbles.find(b => b.id === this.badBubbleId)) {
                            this.badBubbleId = newId;
                        }
                    }
                }, CONFIG.RESPAWN_DELAY);
            },

            // Handle bad bubble tap
            handleBadBubble(bubble) {
                this.state = GameState.GAME_OVER;

                // Small delay, then fart sound
                setTimeout(() => {
                    AudioManager.playFart();

                    // Pop the bad bubble
                    bubble.element.classList.add('popping');

                    // Chain reaction - pop all remaining bubbles silently
                    setTimeout(() => {
                        this.bubbles.forEach((b, i) => {
                            if (b.id !== bubble.id) {
                                setTimeout(() => {
                                    b.element.classList.add('silent-pop');
                                }, i * 30); // Stagger the pops
                            }
                        });

                        // Show game over after chain reaction
                        setTimeout(() => {
                            this.showGameOver();
                        }, 400);
                    }, 100);

                }, CONFIG.BAD_BUBBLE_DELAY);
            },

            // Show game over screen
            showGameOver() {
                // Stop animation
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }

                // Update best score
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('badBubbleBest', this.bestScore);
                }

                // Update UI
                this.finalScoreEl.textContent = this.score;
                this.bestScoreEl.textContent = this.bestScore;
                this.scoreDisplay.style.display = 'none';

                // Show game over screen with fade
                this.gameOverScreen.style.display = 'flex';
                requestAnimationFrame(() => {
                    this.gameOverScreen.classList.add('visible');
                });
            },

            // Return to home/menu
            goHome() {
                this.state = GameState.MENU;

                // Clean up
                this.playArea.innerHTML = '';
                this.bubbles = [];

                // Update UI
                this.gameOverScreen.classList.remove('visible');
                setTimeout(() => {
                    this.gameOverScreen.style.display = 'none';
                    this.startScreen.style.display = 'flex';
                }, 300);

                // Set new background for freshness
                this.setRandomBackground();
            },

            // Animation loop for bubble movement
            startAnimationLoop() {
                let lastTime = performance.now();

                const animate = (currentTime) => {
                    if (this.state !== GameState.PLAYING) return;

                    const deltaTime = (currentTime - lastTime) / 16; // Normalize to ~60fps
                    lastTime = currentTime;

                    this.bubbles.forEach(bubble => {
                        // Update wobble phase
                        bubble.wobbleOffset += CONFIG.WOBBLE_SPEED * deltaTime;

                        // Calculate new position
                        let newY = bubble.y - CONFIG.FLOAT_SPEED * deltaTime;
                        let newX = bubble.x + Math.sin(bubble.wobbleOffset) * CONFIG.WOBBLE_AMOUNT * deltaTime;

                        // Boundary checks
                        const maxX = this.playAreaRect.width - bubble.size;
                        const maxY = this.playAreaRect.height - bubble.size;

                        // Wrap around vertically (respawn at bottom when reaching top)
                        if (newY < -bubble.size) {
                            newY = maxY + bubble.size;
                            newX = Math.random() * maxX; // New random X when wrapping
                        }

                        // Keep X within bounds
                        if (newX < 0) newX = 0;
                        if (newX > maxX) newX = maxX;

                        // Update position
                        bubble.x = newX;
                        bubble.y = newY;
                        bubble.element.style.left = newX + 'px';
                        bubble.element.style.top = newY + 'px';
                    });

                    this.animationId = requestAnimationFrame(animate);
                };

                this.animationId = requestAnimationFrame(animate);
            }
        };

        // Initialize game when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            Game.init();
        });
    </script>
</body>
</html>
